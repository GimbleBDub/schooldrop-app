name: schooldrop
description: "SchoolDrop — safe, verified school transport in Botswana."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.7.2

dependencies:
  dio: ^5.11.1
  file_picker: ^11.0.3
  flutter:
    sdk: flutter
  flutter_map: ^8.3.2
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: ^10.3.4
  geolocator: ^14.0.2
  go_router: ^17.0.0
  google_fonts: ^6.3.2
  image_picker: ^1.2.1
  intl: ^0.20.2
  latlong2: ^0.10.1
  url_launcher: ^6.3.2
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # Inter ships with the app (google_fonts finds it here), so text looks right offline
  assets:
    - assets/fonts/
